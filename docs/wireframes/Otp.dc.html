<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1565c0}a:hover{color:#0d47a1}
.wf-input{box-sizing:border-box;width:100%;height:48px;padding:0 14px;border:1px solid #9e9e9e;border-radius:6px;font:inherit;font-size:16px;color:#212121;background:#fff}
.wf-input::placeholder{color:#757575}
</style>
</helmet>
<div style="min-height: 800px; background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #212121; display: flex; flex-direction: column">
  <header style="height: 64px; background: #424242; color: #fff; display: flex; align-items: center; padding: 0 24px">
    <span style="font-size: 20px; font-weight: 600">Bank App</span>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px">
    <form style="width: 100%; max-width: 440px; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">Enter your code</h1>
        <p style="margin: 0; font-size: 15px; color: #616161; line-height: 1.5">Step 2 of 2. We sent a 6-digit code to <strong style="color: #212121">dana@example.com</strong>. It expires in 5 minutes.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="o-code" style="font-size: 14px; font-weight: 500">6-digit code</label>
        <input id="o-code" class="wf-input" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size: 28px; letter-spacing: 12px; text-align: center; height: 64px">
        <span style="font-size: 13px; color: #616161">You have 5 tries.</span>
      </div>
      <a href="Dashboard.dc.html" style="height: 48px; border-radius: 6px; background: #1565c0; color: #fff; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px">Verify</a>
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px">
        <span style="color: #616161">Didn't get it?</span>
        <button type="button" style="border: 0; background: none; color: #1565c0; font: inherit; font-weight: 600; min-height: 44px; padding: 0 8px">Send a new code</button>
      </div>
      <a href="Main.dc.html" style="font-size: 14px; text-align: center">Back to sign up</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
