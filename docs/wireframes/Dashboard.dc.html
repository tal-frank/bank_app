<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1565c0}a:hover{color:#0d47a1}
</style>
</helmet>
<div style="min-height: 900px; background: #f5f5f5; font-family: Inter, system-ui, sans-serif; color: #212121; display: flex; flex-direction: column">
  <header style="min-height: 64px; background: #424242; color: #fff; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 8px 24px; box-sizing: border-box">
    <span style="font-size: 20px; font-weight: 600">Bank App</span>
    <nav style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <span style="font-size: 14px; color: #eeeeee">dana@example.com</span>
      <a href="SignedOut.dc.html" style="color: #fff; border: 1px solid #fff; border-radius: 6px; min-height: 40px; padding: 0 14px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600">Log out</a>
    </nav>
  </header>
  <main style="width: 100%; max-width: 1040px; margin: 0 auto; padding: 32px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <section style="background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; color: #616161; font-weight: 500">Current balance</span>
        <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.5px">₪ 4,250.00</span>
        <span style="font-size: 13px; color: #616161">Sample value. The server stores agorot (425000); the UI shows shekels.</span>
      </div>
      <a href="Transfer.dc.html" style="height: 48px; padding: 0 24px; border-radius: 6px; background: #1565c0; color: #fff; text-decoration: none; display: flex; align-items: center; font-weight: 600; font-size: 16px">Send money</a>
    </section>
    <section style="background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600">Transactions</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 15px">
          <thead>
            <tr style="text-align: left; color: #616161; font-size: 13px">
              <th style="padding: 10px 12px; border-bottom: 1px solid #e0e0e0; font-weight: 600">Date</th>
              <th style="padding: 10px 12px; border-bottom: 1px solid #e0e0e0; font-weight: 600">Type</th>
              <th style="padding: 10px 12px; border-bottom: 1px solid #e0e0e0; font-weight: 600">With</th>
              <th style="padding: 10px 12px; border-bottom: 1px solid #e0e0e0; font-weight: 600; text-align: right">Amount</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
              <tr>
                <td style="padding: 14px 12px; border-bottom: 1px solid #eeeeee; color: #616161">{{row.date}}</td>
                <td style="padding: 14px 12px; border-bottom: 1px solid #eeeeee">{{row.type}}</td>
                <td style="padding: 14px 12px; border-bottom: 1px solid #eeeeee">{{row.who}}</td>
                <td style="padding: 14px 12px; border-bottom: 1px solid #eeeeee; text-align: right; font-weight: 600; color: {{row.color}}">{{row.amount}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; font-size: 14px; color: #616161">
        <span>Page 1 of 3 · 10 per page</span>
        <div style="display: flex; gap: 8px">
          <button type="button" disabled style="min-height: 40px; padding: 0 14px; border: 1px solid #bdbdbd; border-radius: 6px; background: #fff; color: #9e9e9e; font: inherit">Previous</button>
          <button type="button" style="min-height: 40px; padding: 0 14px; border: 1px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; font: inherit; font-weight: 600">Next</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Sample rows only: incoming = green with "+", outgoing = dark with "−".
    const inC = '#2e7d32', outC = '#212121';
    return {
      rows: [
        { date: '22 Nov 2026, 10:14', type: 'Received', who: 'yossi@example.com', amount: '+ ₪ 150.00', color: inC },
        { date: '21 Nov 2026, 18:02', type: 'Sent', who: 'noa@example.com', amount: '− ₪ 75.50', color: outC },
        { date: '20 Nov 2026, 09:30', type: 'Sent', who: 'avi@example.com', amount: '− ₪ 1,200.00', color: outC },
        { date: '18 Nov 2026, 14:47', type: 'Received', who: 'noa@example.com', amount: '+ ₪ 40.00', color: inC },
        { date: '17 Nov 2026, 11:05', type: 'Sent', who: 'yossi@example.com', amount: '− ₪ 22.90', color: outC },
        { date: '16 Nov 2026, 08:12', type: 'Received', who: 'avi@example.com', amount: '+ ₪ 500.00', color: inC }
      ]
    };
  }
}
</script>
</body>
</html>
